<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:#000;font-family:"PingFang SC","Heiti SC",sans-serif}
#c{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:url(launch.jpg) center 50%/cover no-repeat}
#c::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,22,48,.55) 0%,rgba(8,22,48,.25) 38%,rgba(0,0,0,0) 55%)}
.big{position:absolute;left:0;right:0;top:calc(var(--u)*8.5);text-align:center;line-height:1.05}
.big .a{font-size:calc(var(--u)*10);font-weight:900;color:#fff;-webkit-text-stroke:calc(var(--u)*1.3) #000;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.5) rgba(0,0,0,.6)}
.big .b{font-size:calc(var(--u)*15);font-weight:900;color:#ffd21f;-webkit-text-stroke:calc(var(--u)*1.8) #000;paint-order:stroke fill;text-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(0,0,0,.7)}
.tag{position:absolute;padding:calc(var(--u)*1) calc(var(--u)*2.4);border-radius:calc(var(--u)*1.6);background:#fff;color:#111;font-weight:900;font-size:calc(var(--u)*4);border:calc(var(--u)*.5) solid #000}
.tag::after{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-2.6);border:calc(var(--u)*1.3) solid transparent;border-top-color:#000;transform:translateX(-50%)}
.badge{position:absolute;left:calc(var(--u)*2.4);top:calc(var(--u)*2.4);display:flex;align-items:center;gap:calc(var(--u)*1.2);padding:calc(var(--u)*.7) calc(var(--u)*2.2) calc(var(--u)*.7) calc(var(--u)*.7);border-radius:999px;background:rgba(0,0,0,.6)}
.badge img{width:calc(var(--u)*5.4);height:calc(var(--u)*5.4);border-radius:50%;border:calc(var(--u)*.35) solid #fff;background:#fff}
.badge b{color:#fff;font-size:calc(var(--u)*2.6);font-weight:800}
</style></head><body>
<div id="c">
  <div class="badge"><img src="../brand/avatar.png"><b>粑粑柑（梭哈ai版）</b></div>
  <div class="big"><div class="a">如何在塞尔达</div><div class="b">完成载人航天</div></div>
  <div class="tag" id="pilot">乘客</div>
</div>
<script>
const q=new URLSearchParams(location.search),w=+(q.get('w')||1920),h=+(q.get('h')||1080);
const r=document.documentElement.style;r.setProperty('--w',w+'px');r.setProperty('--h',h+'px');r.setProperty('--u',(Math.min(w,h*1.5)/100)+'px');
const s=Math.max(w/1920,h/1080), ox=(w-1920*s)/2, oy=(h-1080*s)*0.5;
const p=document.getElementById('pilot'); p.style.left=(ox+962*s)+'px'; p.style.top=(oy+640*s)+'px'; p.style.transform='translate(-50%,-115%)';
window.READY=true;
</script></body></html>
